# A small card in the bottom-left corner over the wallpaper, styled after
# qs-greeter: the dark casing, a black display for the password, monospace
# readouts, orange as the one accent.

general {
    disable_loading_bar = true
    grace = 1
    hide_cursor = true
    no_fade_in = true
}

# soft-shell's Wallpaper.qml rewrites this path when the wallpaper changes
background {
    monitor =
    color = rgb(1c1c1b)
    path = /home/froggo/workspaces/walls/okeykat-tgxqpsVG-0A-unsplash.jpg
}

# the card
shape {
    monitor =
    size = 320, 250
    color = rgb(1c1c1b)
    rounding = 4
    border_size = 1
    border_color = rgb(4d4d4a)
    halign = left
    valign = bottom
    position = 48, 48
    zindex = 0
}

# clock
label {
    monitor =
    text = $TIME
    color = rgb(ededea)
    font_size = 40
    font_family = JetBrains Mono Light
    halign = left
    valign = bottom
    position = 68, 200
    zindex = 1
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%a %-d %b' | tr '[:upper:]' '[:lower:]'
    color = rgb(9a9a96)
    font_size = 11
    font_family = JetBrains Mono
    halign = left
    valign = bottom
    position = 68, 176
    zindex = 1
}

# user
label {
    monitor =
    text = $USER
    color = rgb(ededea)
    font_size = 11
    font_family = Manrope
    halign = left
    valign = bottom
    position = 68, 146
    zindex = 1
}

# password, on a display
input-field {
    monitor =
    size = 280, 40
    outline_thickness = 1
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    outer_color = rgb(3a3a38)
    inner_color = rgb(0a0a0a)
    font_color = rgb(f2f2f0)
    font_family = JetBrains Mono
    placeholder_text = <span foreground="##8c8c88">password</span>
    fail_text = <span foreground="##f2625a">$FAIL ($ATTEMPTS)</span>
    check_color = rgb(ff4f00)
    fail_color = rgb(f2625a)
    capslock_color = rgb(ff4f00)
    fade_on_empty = false
    hide_input = false
    halign = left
    valign = bottom
    position = 68, 96
    zindex = 1
}

# battery
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh battery
    color = rgb(9a9a96)
    font_size = 10
    font_family = JetBrains Mono
    halign = left
    valign = bottom
    position = 68, 68
    zindex = 1
}

# media, bottom-right: a card of the same kind, its text set against the right edge
shape {
    monitor =
    size = 320, 110
    color = rgb(1c1c1b)
    rounding = 4
    border_size = 1
    border_color = rgb(4d4d4a)
    halign = right
    valign = bottom
    position = -48, 48
    zindex = 0
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-status.sh media-status
    color = rgb(9a9a96)
    font_size = 9
    font_family = JetBrains Mono
    halign = right
    valign = bottom
    position = -68, 126
    zindex = 1
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-status.sh media-title
    color = rgb(ededea)
    font_size = 12
    font_family = Manrope
    halign = right
    valign = bottom
    position = -68, 90
    zindex = 1
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-status.sh media-artist
    color = rgb(9a9a96)
    font_size = 10
    font_family = Manrope
    halign = right
    valign = bottom
    position = -68, 68
    zindex = 1
}
