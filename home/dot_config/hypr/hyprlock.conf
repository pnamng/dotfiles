general {
    disable_loading_bar = true
    grace = 1
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    path = ~/workspaces/walls/cat_night.jpg
    blur_passes = 1
    blur_size = 4
    brightness = 0.75
    contrast = 1.05
}

# username
label {
    monitor =
    text = $USER
    color = rgba(98, 106, 115, 1.0)
    font_size = 14
    font_family = SF Pro Rounded:style=Medium
    halign = center
    valign = center
    position = 0, 256
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(13, 16, 23, 0.45)
}

# clock — $TIME is hyprlock's built-in 24h live clock variable
label {
    monitor =
    text = $TIME
    color = rgba(191, 189, 182, 1.0)
    font_size = 120
    font_family = SF Pro Rounded:style=Ultralight
    halign = center
    valign = center
    position = 0, 158
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(13, 16, 23, 0.5)
    shadow_boost = 1.2
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = rgba(98, 106, 115, 1.0)
    font_size = 18
    font_family = SF Pro Rounded:style=Medium
    halign = center
    valign = center
    position = 0, 55
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(13, 16, 23, 0.45)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(57, 186, 230, 0.55)
    inner_color = rgba(13, 16, 23, 0.65)
    font_color = rgba(191, 189, 182, 1.0)
    font_family = SF Pro Rounded
    fade_on_empty = true
    fade_timeout = 0
    placeholder_text = <span foreground="##626a73">password</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
    rounding = 10
    check_color = rgba(57, 186, 230, 0.9)
    fail_color = rgba(240, 113, 120, 0.9)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(230, 180, 80, 0.9)
}

# hint
label {
    monitor =
    text = press enter to unlock
    color = rgba(98, 106, 115, 1.0)
    font_size = 11
    font_family = SF Pro Rounded
    halign = center
    valign = center
    position = 0, -50
}

# status row, bottom-left
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh battery
    color = rgba(98, 106, 115, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Propo
    halign = left
    valign = bottom
    position = 48, 44
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh network
    color = rgba(98, 106, 115, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Propo
    halign = left
    valign = bottom
    position = 48, 74
}
