general {
    disable_loading_bar = true
    grace = 1
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = ~/workspaces/walls/island_lowlight.png
    blur_passes = 2
    blur_size = 6
    noise = 0.012
    contrast = 0.85
    brightness = 0.75
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

# ── Time ──────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(230, 180, 80, 0.95)       # ayu yellow
    font_size = 96
    font_family = Maple Mono
    position = 0, 280
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(191, 189, 182, 0.75)      # ayu fg
    font_size = 22
    font_family = Maple Mono
    position = 0, 175
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(57, 186, 230, 0.55) # ayu cyan
    inner_color = rgba(13, 16, 23, 0.65)   # ayu bg
    font_color = rgba(191, 189, 182, 1.0)  # ayu fg
    fade_on_empty = false
    placeholder_text = <span foreground="##626a73">password</span>
    hide_input = false
    position = 0, 60
    halign = center
    valign = center
    rounding = 10
    check_color = rgba(57, 186, 230, 0.9)  # ayu cyan
    fail_color = rgba(240, 113, 120, 0.9)  # ayu red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300
    capslock_color = rgba(230, 180, 80, 0.9) # ayu yellow
}

# ── Battery ───────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%"
    color = rgba(98, 106, 115, 0.85)       # ayu comment
    font_size = 13
    font_family = Maple Mono
    position = -24, -24
    halign = right
    valign = top
}
