# hypridle — idle management
# Timeline (idle seconds):
#   150  dim backlight            (restored on activity)
#   180  keyboard backlight off   (restored on activity)
#   300  lock
#   330  screens off (DPMS)
#   1800 suspend — only when on battery

general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = loginctl lock-session       # lock before the screen can flash on resume
    inhibit_sleep = 3                              # hold suspend until the lock screen has actually locked the session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # some panels stay dark without this
    ignore_dbus_inhibit = false                    # honour inhibitors (browsers, video players)
    ignore_systemd_inhibit = false
}

# dim the panel, remembering the previous level
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# keyboard backlight (harmless if the device is absent)
listener {
    timeout = 180
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screens off shortly after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

# suspend on battery only; condition_cmd skips the rule while plugged in
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
