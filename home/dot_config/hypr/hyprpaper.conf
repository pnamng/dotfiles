# No `wallpaper {}` block here on purpose.
#
# soft-shell owns the wallpaper: it's persisted as `wallpaper` in
# ~/workspaces/soft-shell/config.json and applied at shell startup by
# configs/Wallpaper.qml. Setting one here as well would have hyprpaper paint
# its own choice at boot and soft-shell visibly repaint over it a moment
# later, so this file keeps only the daemon options.
#
# ipc must stay on — it's how soft-shell sets the wallpaper at runtime.
splash = false
ipc = on
