# Fuzzel Configuration - Ayu Dark Theme
# Place this file at: ~/.config/fuzzel/fuzzel.ini

[main]
anchor=center

# Terminal emulator to use for terminal programs
terminal=ghostty

# Number of results to display
lines=5

# Width of the window (characters or percentage)
width=40

# Horizontal padding (pixels)
horizontal-pad=20

# Vertical padding (pixels)
vertical-pad=15

# Inner padding between text and border (pixels)
inner-pad=10

# Show icons
icons-enabled=yes

# Show action list
show-actions=yes

# Font configuration - GeistMono Nerd Font
font=Maple Mono:size=12

# DPI awareness
dpi-aware=no

# Line height (pixels)
line-height=25

# Letter spacing
letter-spacing=0

# Layer (overlay/top/bottom)
layer=overlay

# Exit immediately on selection
exit-on-keyboard-focus-loss=yes

[colors]
# Color format: RRGGBBAA (hexadecimal with alpha)
# Ayu Dark theme colors

# Background color - Ayu dark bg with transparency
background=0d1017e6

# Text color - Ayu fg
text=bfbdb6ff

# Matched characters color - Ayu cyan
match=39bae6ff

# Selected background - Ayu selection with transparency
selection=25334099

# Selected text color - Ayu fg
selection-text=bfbdb6ff

# Selected matched characters - Ayu green
selection-match=7fd962ff

# Border color - Ayu cyan
border=39bae6ff

[border]
# Border width (pixels)
width=2

# Border radius (pixels)
radius=8

[dmenu]
# dmenu mode specific settings
mode=text
exit-immediately-if-empty=no
